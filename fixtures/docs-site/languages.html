<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Multiple languages</title>
  </head>
  <body>
    <main>
      <h1>Multiple languages</h1>

      <h2>TypeScript</h2>
      <pre><code class="language-ts">const x: number = 1;</code></pre>

      <h2>Python</h2>
      <pre class="lang-py"><code>x = 1
print(x)</code></pre>

      <h2>Shell</h2>
      <pre data-language="bash"><code>$ echo done</code></pre>

      <h2>Uppercase class</h2>
      <pre><code class="language-JavaScript">console.log(1);</code></pre>

      <h2>No language</h2>
      <pre><code>{ "plain": true }</code></pre>

      <h2>Untagged shell prompts</h2>
      <pre><code>$ cd project
$ ls</code></pre>
    </main>
  </body>
</html>
