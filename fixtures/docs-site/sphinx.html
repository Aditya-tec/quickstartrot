<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sphinx-style markup</title>
  </head>
  <body>
    <div role="main">
      <h1>Sphinx-style markup</h1>
      <p>Install the package:</p>
      <div class="highlight-console notranslate">
        <div class="highlight"><pre><span></span><span class="gp">$ </span>pip install flask
</pre></div>
      </div>
      <p>Then create <code>hello.py</code>:</p>
      <div class="highlight-python notranslate">
        <div class="highlight"><pre><span></span><span class="kn">from</span> <span class="nn">flask</span> <span class="kn">import</span> <span class="n">Flask</span>
<span class="n">app</span> <span class="o">=</span> <span class="n">Flask</span><span class="p">(</span><span class="vm">__name__</span><span class="p">)</span>
</pre></div>
      </div>
      <div class="highlight-default notranslate">
        <div class="highlight"><pre><span></span>plain text, no language
</pre></div>
      </div>
    </div>
  </body>
</html>
