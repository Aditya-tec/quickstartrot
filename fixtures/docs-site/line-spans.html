<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Per-line spans</title>
    <style>
      .line {
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Per-line spans</h1>
      <p>Highlighters render each line as a span and leave blank lines empty:</p>
      <pre><code class="language-python"><span class="line">from datetime import datetime</span><span class="line"></span><span class="line">class User:</span><span class="line">    id: int</span><span class="line"></span><span class="line"></span><span class="line">print(User)</span></code></pre>
      <pre><code class="language-bash"><span class="line">npm install x</span><span class="line"><span style="display: none">Copy</span>npm run y</span></code></pre>
    </main>
  </body>
</html>
