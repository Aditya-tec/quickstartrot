<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Collapsed sections</title>
  </head>
  <body>
    <main>
      <h1>Collapsed sections</h1>
      <pre><code class="language-bash">npm install collapsed-sdk</code></pre>

      <details>
        <summary>Show advanced setup</summary>
        <p>Run the advanced setup script:</p>
        <pre><code class="language-bash">npm run advanced-setup</code></pre>
        <details>
          <summary>Nested troubleshooting</summary>
          <pre><code class="language-bash">npm cache clean --force</code></pre>
        </details>
      </details>

      <details open>
        <summary>Already open</summary>
        <pre><code class="language-bash">npm run already-open</code></pre>
      </details>
    </main>
  </body>
</html>
