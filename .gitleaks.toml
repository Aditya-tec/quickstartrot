title = "QuickstartRot gitleaks config"

[extend]
useDefault = true

# The ONLY allowlisted values are the placeholders the spec itself uses for "a key from the docs"
# and the dummy replacement the harness injects. They appear in tests and target files on purpose.
# Do not widen this list: a real secret must always fail the build.
[allowlist]
description = "Obviously fake placeholder values used in tests, fixtures and targets"
regexes = [
  '''re_123456789''',
  '''re_xxxxxxxxx''',
  '''qsr_dummy_key''',
  # Inputs of the redaction tests, which must look like secrets to prove they get removed:
  # an ascending hex run, and the base64 of "foobarbazqux123456".
  '''0123456789abcdef''',
  '''Zm9vYmFyYmF6cXV4MTIzNDU2''',
  '''foobarbazqux123456''', # gitleaks also checks the decoded base64
]
