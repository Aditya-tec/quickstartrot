name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # With a cache hit the browser download is skipped; --with-deps still installs the system libraries.
      - run: pnpm --filter @qsr/crawler exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Docker is preinstalled on ubuntu-latest: the executor and canary integration tests must RUN here,
      # so a missing Docker fails the build instead of silently skipping them.
      # A throwaway Postgres for the API integration tests: no Supabase secrets in CI. QSR_REQUIRE_DB makes a
      # missing database a failure instead of a silent skip; the live-Supabase RLS tests stay gated behind secrets.
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: pnpm test
        env:
          QSR_REQUIRE_DOCKER: '1'
          QSR_REQUIRE_DB: '1'
          QSR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/qsr_test
      - name: Stop the test database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
      # The pre-commit secret gate must actually block: these tests stage a fake secret in a scratch
      # repository and fail if the gate lets it through (or silently skips because nothing can scan).
      - run: pnpm test:scripts
        env:
          QSR_REQUIRE_DOCKER: '1'
      - run: pnpm build
      - run: pnpm audit --prod

  # Lints every workflow file, including the shell in its run: blocks. A finding fails the build.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color .github/workflows/*.yml

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
