name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # With a cache hit the browser download is skipped; --with-deps still installs the system libraries.
      - run: pnpm --filter @qsr/crawler exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Docker is preinstalled on ubuntu-24.04: the executor and canary integration tests must RUN here,
      # so a missing Docker fails the build instead of silently skipping them.
      # A throwaway Postgres for the API integration tests: no Supabase secrets in CI. QSR_REQUIRE_DB makes a
      # missing database a failure instead of a silent skip; the live-Supabase RLS tests stay gated behind secrets.
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: pnpm test
        env:
          QSR_REQUIRE_DOCKER: '1'
          QSR_REQUIRE_DB: '1'
          QSR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/qsr_test
      - name: Stop the test database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
      # The pre-commit secret gate must actually block: these tests stage a fake secret in a scratch
      # repository and fail if the gate lets it through (or silently skips because nothing can scan).
      - run: pnpm test:scripts
        env:
          QSR_REQUIRE_DOCKER: '1'
      - run: pnpm build
      # The website, end to end: the production build with seeded fixtures and a stub API (no secrets, no network):
      # pages, filters, the safety rule (an unreviewed incident leaks nowhere), badge, submit, admin, and axe on every
      # page in both themes at 375 and 1280 px.
      - name: Web end-to-end tests
        run: pnpm --filter @qsr/web test:e2e --project=desktop --project=mobile --project=revalidate
      - run: pnpm audit --prod

  # Lints every workflow file, including the shell in its run: blocks. A finding fails the build.
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color .github/workflows/*.yml

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
