name: probe

# The probe pipeline (spec section 12): plan -> execute -> report. Splitting trust this way is the core
# security decision:
#   plan     has secrets, never executes docs code
#   execute  runs docs code, has NO secrets, NO variables, a zero-permission token and no route to the API
#   report   has secrets, only reads JSON results, and is the only job that may write issues
on:
  schedule:
    - cron: '17 */6 * * *' # off the hour; GitHub may delay cron runs, nothing here assumes exact timing
  workflow_dispatch:
    inputs:
      only:
        description: 'comma-separated slugs to run (empty: every enabled tool; the canaries always run)'
        required: false
        default: ''

concurrency:
  group: probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      cycle: ${{ steps.plan.outputs.cycle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qsr/crawler exec playwright install --with-deps chromium
      - id: plan
        # The input goes through the environment, never into the script text.
        run: pnpm qsr plan --out plans/ --only "$ONLY"
        env:
          ONLY: ${{ inputs.only }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plans
          path: plans/
          retention-days: 3
          if-no-files-found: error

  execute:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {} # GITHUB_TOKEN has no scopes here
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plans
          path: plans/
      - run: pnpm qsr execute --plans plans/ --shard ${{ matrix.shard }} --out results/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: results-${{ matrix.shard }}
          path: results/
          retention-days: 3
          if-no-files-found: ignore

  report:
    needs: [plan, execute]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # only this job may open or comment on the `harness` issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plans
          path: plans/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        # No results at all (every shard crashed) is a case the report handles, not a reason to stop here.
        continue-on-error: true
        with:
          pattern: results-*
          path: results/
          merge-multiple: true
      - run: pnpm qsr report --results results/ --plans plans/ --cycle "$CYCLE"
        env:
          CYCLE: ${{ needs.plan.outputs.cycle }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
