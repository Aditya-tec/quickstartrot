name: gc

# Nightly storage cleanup (spec section 5, "Storage"): the API deletes step logs and docs diffs older than
# 30 days (except those an incident links) and Playwright traces older than 14 days.
on:
  schedule:
    - cron: '41 3 * * *' # off the hour
  workflow_dispatch:

concurrency:
  group: gc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm qsr gc
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
