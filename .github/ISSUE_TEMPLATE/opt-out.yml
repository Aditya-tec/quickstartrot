name: 'Vendor: question or opt-out'
description: Ask about a result, or ask us to stop testing a quickstart. Probing stops within 24 hours of an opt-out request; we send a written reply within 3 business days.
title: 'Vendor: '
labels: ['vendor']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. Probing of your quickstart stops within 24 hours of an opt-out request, and the tool's history is hidden at the same time. We reply in writing within 3 business days.
        You can also block `QuickstartRotBot` in your `robots.txt`; the crawler obeys it.

        What our requests look like: [docs/ABOUT-OUR-TRAFFIC.md](https://github.com/Aditya-tec/quickstartrot/blob/main/docs/ABOUT-OUR-TRAFFIC.md).
        How we tell a vendor about a failure, and what is never made public: [docs/DISCLOSURE.md](https://github.com/Aditya-tec/quickstartrot/blob/main/docs/DISCLOSURE.md).
  - type: dropdown
    id: need
    attributes:
      label: What do you need?
      options:
        - A question about a result
        - Opt out - stop testing and hide the history
        - A correction - a result is wrong
        - Something else
    validations:
      required: true
  - type: input
    id: docs-url
    attributes:
      label: Docs URL of the quickstart
      description: The page we test, as shown on the quickstart's page on the site.
      placeholder: https://docs.example.com/quickstart
    validations:
      required: true
  - type: input
    id: tool-page
    attributes:
      label: Page on QuickstartRot (optional)
      placeholder: /tools/example-node
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to the product
      options:
        - I work on this product or its documentation
        - I am the maintainer of the open-source project
        - Other
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Anything we should know (optional)
      description: Do not paste secrets or private information; this issue is public.
